<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>figment</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 12px;
    padding: 16px;
    box-sizing: border-box;
    background: #111;
    color: #ddd;
    font: 14px ui-monospace, monospace;
  }
  canvas {
    width: min(512px, calc(100vw - 32px));
    aspect-ratio: 1;
    image-rendering: pixelated;
  }
  p { margin: 0; }
</style>
</head>
<body>
<canvas width="128" height="128" aria-label="The figment screen"></canvas>
<p id="state">loading</p>
<p id="error"></p>
<label>Program <input type="file" accept=".bin"></label>
<script type="module">
const status = document.querySelector("#state");
const error = document.querySelector("#error");
const canvas = document.querySelector("canvas");
const context = canvas.getContext("2d");
const image = context.createImageData(128, 128);
const pixels = new Uint32Array(image.data.buffer);
const states = ["running", "halted", "faulted"];

const { instance } = await WebAssembly.instantiateStreaming(fetch("figment.wasm"));
const wasm = instance.exports;

const rgb = new Uint8Array(wasm.memory.buffer, wasm.palette_ptr(), 48);
const palette = Array.from({ length: 16 }, (_, i) => 0xff000000 | (rgb[i * 3 + 2] << 16) | (rgb[i * 3 + 1] << 8) | rgb[i * 3]);

function load(program) {
  if (program.length > 0x8000) {
    error.textContent = "the program does not fit in memory";
    return;
  }
  error.textContent = "";
  wasm.reset(crypto.getRandomValues(new Uint32Array(1))[0]);
  new Uint8Array(wasm.memory.buffer, wasm.memory_ptr(), program.length).set(program);
}

function frame() {
  const state = states[wasm.step(100000)];
  const screen = new Uint8Array(wasm.memory.buffer, wasm.memory_ptr() + 0x4000, 128 * 128);
  for (let i = 0; i < screen.length; i++) pixels[i] = palette[screen[i] & 15];
  context.putImageData(image, 0, 0);
  if (status.textContent !== state) status.textContent = state;
  requestAnimationFrame(frame);
}

document.querySelector("input").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (file) load(new Uint8Array(await file.arrayBuffer()));
});

load(new Uint8Array(await (await fetch("self-test.bin")).arrayBuffer()));
requestAnimationFrame(frame);
</script>
</body>
</html>
