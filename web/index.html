<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figment</title>
<meta name="description" content="A made-up 8-bit console that runs in the browser. Play Rogue and the demo, or load your own program.">
<!-- The 16 by 16 console icon, in palette colors: gray body, slate bezel, the self-test's pass green, a d-pad and two red buttons. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='1' y='1' width='14' height='14' fill='%23A7ADB8'/%3E%3Crect x='2' y='2' width='12' height='8' fill='%234A4F5C'/%3E%3Crect x='3' y='3' width='10' height='6' fill='%233CC45A'/%3E%3Crect x='3' y='11' width='1' height='3' fill='%234A4F5C'/%3E%3Crect x='2' y='12' width='3' height='1' fill='%234A4F5C'/%3E%3Crect x='11' y='12' width='1' height='1' fill='%23E8343F'/%3E%3Crect x='13' y='12' width='1' height='1' fill='%23E8343F'/%3E%3C/svg%3E">
<style>
  :root {
    /* palette colors 1, 5, 6, 7, 8, A and B */
    --ink: #F4F1E8;
    --dim: #A7ADB8;
    --body: #A7ADB8;
    --bezel: #4A4F5C;
    --green: #3CC45A;
    --red: #E8343F;
    --yellow: #F6D23A;
    --page: #1D2340;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 20px;
    padding: 32px 16px;
    box-sizing: border-box;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 system-ui, sans-serif;
  }
  p { margin: 0; }
  header { text-align: center; display: grid; gap: 6px; }
  h1 { margin: 0 0 8px; line-height: 0; }
  h1 svg { width: min(285px, 100%); }
  header p { color: var(--dim); max-width: 44ch; }

  .console {
    background: var(--body);
    border-radius: 14px 14px 40px 40px;
    padding: 18px 18px 22px;
    display: grid;
    gap: 14px;
    box-shadow: 0 10px 0 #6E7480, 0 24px 40px #0008;
  }
  .bezel { background: var(--bezel); border-radius: 8px; padding: 16px 16px 10px; display: grid; gap: 8px; }
  canvas {
    display: block;
    width: min(384px, calc(100vw - 100px));
    aspect-ratio: 1;
    image-rendering: pixelated;
  }
  .status { font-family: ui-monospace, monospace; display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
  .led { --led: var(--green); width: 8px; height: 8px; background: var(--led); box-shadow: 0 0 6px var(--led); }
  .led[data-state="halted"] { --led: var(--yellow); }
  .led[data-state="faulted"] { --led: var(--red); }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; }
  .controls > :last-child { justify-self: end; }
  .dpad { width: 42px; height: 42px; position: relative; }
  .dpad::before, .dpad::after { content: ""; position: absolute; background: var(--bezel); border-radius: 3px; }
  .dpad::before { left: 14px; top: 0; width: 14px; height: 42px; }
  .dpad::after { top: 14px; left: 0; width: 42px; height: 14px; }
  .brand { font-size: 11px; font-weight: 700; letter-spacing: 0.3em; color: var(--bezel); }
  .buttons { display: flex; gap: 12px; transform: rotate(-20deg); }
  .buttons span {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: grid;
    place-content: center;
    background: var(--red);
    box-shadow: 0 3px 0 #9B1F28;
    color: #9B1F28;
    font-weight: 700;
    transform: rotate(20deg);
  }
  .buttons span:first-child { margin-top: 14px; }

  #error { color: var(--red); }
  #error:empty { display: none; }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  nav a, nav label { padding: 8px 14px; border: 2px solid var(--dim); color: var(--ink); text-decoration: none; cursor: pointer; }
  nav a:hover, nav label:hover { border-color: var(--ink); }
  nav a[aria-current] { background: var(--yellow); border-color: var(--yellow); color: var(--page); }
  nav label { border-style: dashed; color: var(--dim); }
  nav a:focus-visible, footer a:focus-visible, nav label:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
  nav input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; color: var(--dim); font-size: 12px; }
  kbd {
    display: inline-block;
    min-width: 1.6em;
    margin-right: 4px;
    padding: 2px 6px;
    border: 1px solid var(--dim);
    border-bottom-width: 3px;
    border-radius: 4px;
    text-align: center;
    color: var(--ink);
    font: inherit;
  }
  footer a { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <!-- "FIGMENT" in 8 by 8 glyphs like the screen's, with a black shadow one pixel down and right. -->
  <h1><svg role="img" aria-label="Figment" viewBox="0 0 57 8" shape-rendering="crispEdges"><path d="M1 0h6v1h-6zM10 0h4v1h-4zM18 0h4v1h-4zM24 0h2v1h-2zM29 0h2v1h-2zM33 0h6v1h-6zM41 0h2v1h-2zM45 0h2v1h-2zM49 0h6v1h-6zM1 1h2v1h-2zM11 1h2v1h-2zM17 1h2v1h-2zM21 1h2v1h-2zM24 1h3v1h-3zM28 1h3v1h-3zM33 1h2v1h-2zM41 1h3v1h-3zM45 1h2v1h-2zM51 1h2v1h-2zM1 2h2v1h-2zM11 2h2v1h-2zM17 2h2v1h-2zM24 2h7v1h-7zM33 2h2v1h-2zM41 2h6v1h-6zM51 2h2v1h-2zM1 3h5v1h-5zM11 3h2v1h-2zM17 3h2v1h-2zM20 3h3v1h-3zM24 3h2v1h-2zM27 3h1v1h-1zM29 3h2v1h-2zM33 3h5v1h-5zM41 3h6v1h-6zM51 3h2v1h-2zM1 4h2v1h-2zM11 4h2v1h-2zM17 4h2v1h-2zM21 4h2v1h-2zM24 4h2v1h-2zM29 4h2v1h-2zM33 4h2v1h-2zM41 4h2v1h-2zM44 4h3v1h-3zM51 4h2v1h-2zM1 5h2v1h-2zM11 5h2v1h-2zM17 5h2v1h-2zM21 5h2v1h-2zM24 5h2v1h-2zM29 5h2v1h-2zM33 5h2v1h-2zM41 5h2v1h-2zM45 5h2v1h-2zM51 5h2v1h-2zM1 6h2v1h-2zM10 6h4v1h-4zM18 6h4v1h-4zM24 6h2v1h-2zM29 6h2v1h-2zM33 6h6v1h-6zM41 6h2v1h-2zM45 6h2v1h-2zM51 6h2v1h-2z" fill="#000000" transform="translate(1 1)"/><path d="M1 0h6v1h-6zM10 0h4v1h-4zM18 0h4v1h-4zM24 0h2v1h-2zM29 0h2v1h-2zM33 0h6v1h-6zM41 0h2v1h-2zM45 0h2v1h-2zM49 0h6v1h-6zM1 1h2v1h-2zM11 1h2v1h-2zM17 1h2v1h-2zM21 1h2v1h-2zM24 1h3v1h-3zM28 1h3v1h-3zM33 1h2v1h-2zM41 1h3v1h-3zM45 1h2v1h-2zM51 1h2v1h-2zM1 2h2v1h-2zM11 2h2v1h-2zM17 2h2v1h-2zM24 2h7v1h-7zM33 2h2v1h-2zM41 2h6v1h-6zM51 2h2v1h-2zM1 3h5v1h-5zM11 3h2v1h-2zM17 3h2v1h-2zM20 3h3v1h-3zM24 3h2v1h-2zM27 3h1v1h-1zM29 3h2v1h-2zM33 3h5v1h-5zM41 3h6v1h-6zM51 3h2v1h-2zM1 4h2v1h-2zM11 4h2v1h-2zM17 4h2v1h-2zM21 4h2v1h-2zM24 4h2v1h-2zM29 4h2v1h-2zM33 4h2v1h-2zM41 4h2v1h-2zM44 4h3v1h-3zM51 4h2v1h-2zM1 5h2v1h-2zM11 5h2v1h-2zM17 5h2v1h-2zM21 5h2v1h-2zM24 5h2v1h-2zM29 5h2v1h-2zM33 5h2v1h-2zM41 5h2v1h-2zM45 5h2v1h-2zM51 5h2v1h-2zM1 6h2v1h-2zM10 6h4v1h-4zM18 6h4v1h-4zM24 6h2v1h-2zM29 6h2v1h-2zM33 6h6v1h-6zM41 6h2v1h-2zM45 6h2v1h-2zM51 6h2v1h-2z" fill="#F4F1E8"/></svg></h1>
  <p>A made-up 8-bit console that runs in the browser. Play Rogue and the demo, or load your own program.</p>
</header>
<div class="console">
  <div class="bezel">
    <canvas width="128" height="128" aria-label="The Figment screen"></canvas>
    <p class="status"><span class="led"></span><span id="state">loading</span></p>
  </div>
  <div class="controls" aria-hidden="true">
    <div class="dpad"></div>
    <span class="brand">FIGMENT</span>
    <div class="buttons"><span>B</span><span>A</span></div>
  </div>
</div>
<p id="error" role="alert"></p>
<nav>
  <a href="?program=rogue.bin">Rogue</a>
  <a href="?program=demo.bin">Demo</a>
  <a href="?">Self-test</a>
  <label>Load .bin<input type="file" accept=".bin"></label>
</nav>
<p class="keys">
  <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd>move</span>
  <span><kbd>Z</kbd>A</span>
  <span><kbd>X</kbd>B</span>
  <span><kbd>Enter</kbd>Start</span>
  <span><kbd>Shift</kbd>Select</span>
</p>
<footer><a href="https://github.com/stommeras/figment">Source on GitHub</a></footer>
<script type="module">
const memorySize = 0x8000;
const screenStart = 0x4000;
const screenSize = 128;
const stepsPerFrame = 100000;
const frameTime = 1000 / 60;
const maxFramesPerTick = 4;
const keysAddress = 0x3F00;
const beepAddress = 0x3F01;
const keyBits = { ArrowUp: 1, ArrowDown: 2, ArrowLeft: 4, ArrowRight: 8, z: 16, x: 32, Enter: 64, Shift: 128 };

const stateText = document.querySelector("#state");
const led = document.querySelector(".led");
const errorText = document.querySelector("#error");
const canvas = document.querySelector("canvas");
const context = canvas.getContext("2d");
const image = context.createImageData(screenSize, screenSize);
const pixels = new Uint32Array(image.data.buffer);
const states = ["running", "halted", "faulted"];

let wasm;
let palette;
let keys = 0;
let lag = 0;
let lastTime;
let audio;
let oscillator;
let volume;
let programName = "";

function load(program, name) {
  if (program.length > memorySize) {
    errorText.textContent = "the program does not fit in memory";
    return;
  }
  errorText.textContent = "";
  // "rogue.bin" is shown as "Rogue", in the tab title and the status line.
  const base = name.replace(/\.bin$/, "");
  programName = `${base.charAt(0).toUpperCase()}${base.slice(1)}`;
  document.title = `${programName} · Figment`;
  for (const link of document.querySelectorAll("nav a")) {
    if ((new URL(link.href).searchParams.get("program") ?? "self-test.bin") === name) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  }
  setBeep(0);
  wasm.reset(crypto.getRandomValues(new Uint32Array(1))[0]);
  new Uint8Array(wasm.memory.buffer, wasm.memory_ptr(), program.length).set(program);
}

function startAudio() {
  if (audio) return;
  audio = new AudioContext();
  oscillator = new OscillatorNode(audio, { type: "square" });
  volume = new GainNode(audio, { gain: 0 });
  oscillator.connect(volume).connect(audio.destination);
  oscillator.start();
}

function setBeep(note) {
  if (!audio) return;
  const on = note >= 1 && note <= 127;
  if (on) oscillator.frequency.setValueAtTime(440 * 2 ** ((note - 69) / 12), audio.currentTime);
  volume.gain.setValueAtTime(on ? 0.1 : 0, audio.currentTime);
}

function keyBit(event) {
  return keyBits[event.key.length === 1 ? event.key.toLowerCase() : event.key] ?? 0;
}

addEventListener("keydown", (event) => {
  startAudio();
  const bit = keyBit(event);
  if (event.key.startsWith("Arrow")) event.preventDefault();
  keys |= bit;
});
addEventListener("keyup", (event) => { keys &= ~keyBit(event); });
addEventListener("blur", () => { keys = 0; });
addEventListener("pointerdown", startAudio);

function frame(now) {
  lag = Math.min(lag + now - (lastTime ?? now), maxFramesPerTick * frameTime);
  lastTime = now;
  const machine = new Uint8Array(wasm.memory.buffer, wasm.memory_ptr(), memorySize);
  let state = wasm.state();
  for (; lag >= frameTime; lag -= frameTime) {
    machine[keysAddress] = keys;
    state = wasm.step(stepsPerFrame);
  }
  setBeep(state === 0 ? machine[beepAddress] : 0);
  const screen = machine.subarray(screenStart);
  for (let i = 0; i < screen.length; i++) pixels[i] = palette[screen[i] & 15];
  context.putImageData(image, 0, 0);
  const status = `${programName} · ${states[state]}`;
  if (stateText.textContent !== status) {
    stateText.textContent = status;
    led.dataset.state = states[state];
  }
  requestAnimationFrame(frame);
}

document.querySelector("input").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (file) load(new Uint8Array(await file.arrayBuffer()), file.name);
  event.target.value = "";
});

async function fetchBytes(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`cannot load ${url}: ${response.status}`);
  return response;
}

try {
  ({ exports: wasm } = (await WebAssembly.instantiateStreaming(fetchBytes("figment.wasm"))).instance);
  const paletteBytes = new Uint8Array(wasm.memory.buffer, wasm.palette_ptr(), 48);
  palette = Array.from({ length: 16 }, (_, i) => 0xff000000 | (paletteBytes[i * 3 + 2] << 16) | (paletteBytes[i * 3 + 1] << 8) | paletteBytes[i * 3]);
  const program = new URLSearchParams(location.search).get("program") ?? "self-test.bin";
  load(new Uint8Array(await (await fetchBytes(program)).arrayBuffer()), program);
  requestAnimationFrame(frame);
} catch (error) {
  stateText.textContent = "";
  errorText.textContent = error.message;
}
</script>
</body>
</html>
